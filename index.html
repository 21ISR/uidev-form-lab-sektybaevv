<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-card">
        
        <div class="header-bg">
            <h1>Student Login</h1>
            <p class="pod">Access your student account</p>
        </div>
        
        
        <div class="form-content">
            <form action="/api/login" method="post">
                <div class="form">
                    <label for="email">Email or Student ID</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email or Student ID">
                </div>


                <div class="form">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password">
                </div>


                <div class="formcheck">
                    <label class="checkbox">
                        <input type="checkbox" id="remember" name="remember" value="true">
                        <span>Remember me</span>
                    </label>
                    <a href="#" class="link">Forgot password</a>
                </div>


                <button class="submit">Log In</button>   
            </form>

            <div class="or">OR</div>


            <div class="social-login">
                <div class="social-icon">
                    <svg viewBox="0 0 488 512" height="25px" width="25px" xmlns="http://www.w3.org/2000/svg">
                        <path d="M488 261.8C488 403.3 391.1 504 248 504 110.8 504 0 393.2 0 256S110.8 8 248 8c66.8 0 123 24.5 166.3 64.9l-67.5 64.9C258.5 52.6 94.3 116.6 94.3 256c0 86.5 69.1 156.6 153.7 156.6 98.2 0 135-70.4 140.8-106.9H248v-85.3h236.1c2.3 12.7 3.9 24.9 3.9 41.4z"/>
                    </svg>
                </div>


                <div class="social-icon">
                    <svg viewBox="0 0 448 512" height="25px" width="25px" xmlns="http://www.w3.org/2000/svg">
                        <path d="M0 93.7l183.6-25.3v177.4H0V93.7zm0 324.6l183.6 25.3V268.4H0v149.9zm203.8 28L448 480V268.4H203.8v177.9zm0-380.6v180.1H448V32L203.8 65.7z"/>
                    </svg>
                </div>


                <div class="social-icon">
                    <svg viewBox="0 0 384 512" height="25px" width="25px" xmlns="http://www.w3.org/2000/svg">
                        <path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/>
                    </svg>
                </div>
            </div>


            <p class="text"> 
                Don't have an account? <a href="register.html" class="link">Register</a>
            </p>
        </div>
    </div>
</body>
</html>
