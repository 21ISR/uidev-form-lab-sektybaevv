<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="register-card">
        <div class="header-bg">
            <h1>Student Registration</h1>
            <p class="pod">Create your Student account</p>
        </div>
        

        <div class="form-content">
            <form action="/api/register" method="post">
                <div class="form">
                    <label for="fullname">Full Name</label>
                    <input type="text" id="fullname" name="fullname" placeholder="Enter your full name">
                </div>


                <div class="form">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email">
                </div>


                <div class="form">
                    <label for="student-id">Student ID</label>
                    <input type="text" id="student-id" name="student-id" placeholder="Enter your student ID">
                </div>


                <div class="form">
                    <label for="program">Select Program</label>
                    <select id="program" name="program">
                        <option value="" disabled selected>Choose your program</option>
                        <option value="Computer Science">Computer Science</option>
                        <option value="Engineering">Engineering</option>
                        <option value="Business">Business</option>
                        <option value="Arts & Humanities">Arts & Humanities</option>
                        <option value="Science">Science</option>
                        <option value="prepod">Препод преподский</option>
                    </select>
                </div> 


                <div class="form">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Create a password">
                </div>


                <div class="form">
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm your password">
                </div>


                <div class="formcheck">
                    <input type="checkbox" id="terms" name="terms" value="true">
                    <label for="terms">I agree to the Terms of Service and Privacy Policy</label>
                </div>


                <button type="submit">Create Account</button>
            </form>


            <p class="text">
                Already have an account? <a href="index.html" class="link">Log in</a>
            </p>
        </div>
    </div>
</body>
</html>
